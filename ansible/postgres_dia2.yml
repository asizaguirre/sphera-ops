---
- name: Operações de Dia 2 - PostgreSQL
  hosts: db_servers
  gather_facts: no
  become: no
  vars:
    backup_dir: "/var/backups/postgresql"
    db_name: "ksphera_db"

  tasks:
    - name: Instalar Python e dependências (Bootstrap para Docker)
      raw: apt-get update && apt-get install -y python3 python3-psycopg2 acl sudo
      changed_when: false

    - name: Coletar Fatos (após instalação do Python)
      setup:

    - name: Garantir existência do diretório de backup
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    # Em Docker, o processo principal é o postgres, não gerenciado via systemd
    - name: Verificar se o PostgreSQL está rodando
      command: pg_isready
      register: pg_check
      changed_when: false

    - name: Executar Backup (pg_dump)
      become: yes
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        state: dump
        target: "{{ backup_dir }}/backup_{{ ansible_date_time.date }}.sql"
      when: pg_check.rc == 0

    - name: Verificar conexões ativas
      become: yes
      become_user: postgres
      community.postgresql.postgresql_query:
        db: postgres
        query: "SELECT count(*) FROM pg_stat_activity;"
      register: active_conns

    - name: Exibir resumo da saúde do banco
      ansible.builtin.debug:
        msg: "Status: Online. Conexões ativas: {{ active_conns.query_result[0].count }}"