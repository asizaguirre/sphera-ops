services:
  # --- API Gateway ---
  nginx-lb:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-01
      - api-02

  # --- Mock APIs (para o Nginx ter onde bater) ---
  api-01:
    image: traefik/whoami
    container_name: api-01
  api-02:
    image: traefik/whoami
    container_name: api-02

  # --- Cache (Redis) ---
  redis-master:
    image: redis:alpine
    container_name: redis-master
    ports:
      - "6379:6379"

  redis-slave:
    image: redis:alpine
    container_name: redis-slave
    ports:
      - "6380:6379"
    command: redis-server --replicaof redis-master 6379
    depends_on:
      - redis-master

  # --- Database (PostgreSQL) ---
  db-primary:
    image: postgres:13
    container_name: db-primary
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ksphera_db
    ports:
      - "5432:5432"

  db-standby:
    image: postgres:13
    container_name: db-standby
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ksphera_db
    ports:
      - "5433:5432"

  # --- Messaging (Kafka) ---
  # Configuração simplificada para validação de portas
  kafka-01:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-01
    hostname: kafka-01
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-01:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-01:29093,2@kafka-02:29093,3@kafka-03:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka-01:29092,CONTROLLER://kafka-01:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9092:9092"

  kafka-02:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-02
    hostname: kafka-02
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-02:29092,PLAINTEXT_HOST://localhost:9093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-01:29093,2@kafka-02:29093,3@kafka-03:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka-02:29092,CONTROLLER://kafka-02:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9093:9092"

  kafka-03:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-03
    hostname: kafka-03
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-03:29092,PLAINTEXT_HOST://localhost:9094'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-01:29093,2@kafka-02:29093,3@kafka-03:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka-03:29092,CONTROLLER://kafka-03:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9094:9092"